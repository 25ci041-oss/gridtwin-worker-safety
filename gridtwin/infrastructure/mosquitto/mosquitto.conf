# Mosquitto Configuration for GRIDTWIN
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type all

listener 1883
protocol mqtt

# WebSocket listener for browser-based MQTT clients
listener 9001
protocol websockets

# Authentication
allow_anonymous false
password_file /mosquitto/config/password_file

# Access control
# In production, use an ACL file for topic-level access control
# acl_file /mosquitto/config/acl_file
