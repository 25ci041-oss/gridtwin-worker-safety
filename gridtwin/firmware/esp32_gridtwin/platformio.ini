; GRIDTWIN ESP32 Firmware - PlatformIO Configuration
; 
; WARNING: GPIO pin assignments below are EXAMPLES for a generic ESP32 DevKit.
; You MUST verify and adjust pin assignments for your specific board.
; Consult your board's pinout diagram before connecting any hardware.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Dependencies
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.3

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3

; Serial monitor
monitor_speed = 115200

; Upload settings
upload_speed = 921600
